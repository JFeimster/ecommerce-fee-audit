  - advance repayment
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: LIQ_RESERVE_HOLD
  display_name: Reserves
  parent_category: liquidity_restrictions
  definition: Amount moved into a restricted reserve balance.
  included_transaction_types:
  - rolling reserve
  - risk reserve
  - minimum-balance hold
  excluded_transaction_types:
  - permanent fee
  - confirmed chargeback loss
  expected_sign: negative
  cash_flow_treatment: Reduces available cash but may remain restricted value.
  margin_treatment: Exclude from contribution margin unless converted to confirmed loss.
  reconciliation_treatment: Increase reserve ledger and reduce available payout.
  double_counting_risk: Balance snapshots may be mistaken for new holds.
  human_review_conditions:
  - Missing opening balance
  - release terms unknown
  example_platform_labels:
  - Shopify reserve
  - Stripe reserve_hold
  - Amazon account level reserve
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: LIQ_HOLD
  display_name: Holds
  parent_category: liquidity_restrictions
  definition: Temporary transaction or payout hold not yet classified as reserve or permanent loss.
  included_transaction_types:
  - payout hold
  - deferred transaction
  - pending balance
  excluded_transaction_types:
  - specific reserve hold
  - permanent fee
  expected_sign: contextual
  cash_flow_treatment: Delays availability.
  margin_treatment: No margin effect until resolved.
  reconciliation_treatment: Track aging and expected resolution.
  double_counting_risk: Pending records may later appear in payouts and be counted twice.
  human_review_conditions:
  - Aging or release conditions unclear
  example_platform_labels:
  - Amazon Deferred Transaction
  - Stripe pending
  - Shopify pending
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: LIQ_RESERVE_RELEASE
  display_name: Reserve releases
