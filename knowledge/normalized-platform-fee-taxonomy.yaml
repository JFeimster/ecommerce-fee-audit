  - advance deduction
  - principal payment
  excluded_transaction_types:
  - platform fee
  - tax withholding
  expected_sign: negative
  cash_flow_treatment: Reduces cash.
  margin_treatment: Exclude principal; cost treatment requires support.
  reconciliation_treatment: Link to obligation and payment schedule.
  double_counting_risk: Can duplicate a bank-side payment or blend principal and fees.
  human_review_conditions:
