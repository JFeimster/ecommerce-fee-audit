  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: FIN_REMITTANCE
  display_name: Financing remittances
  parent_category: financing
  definition: Revenue-linked repayment deducted by a platform.
  included_transaction_types:
  - capital remittance
  - revenue share repayment
  excluded_transaction_types:
  - platform fee
  - reserve hold
  expected_sign: negative
  cash_flow_treatment: Reduces payout cash.
  margin_treatment: Exclude principal; include supported financing cost only in a separate view.
  reconciliation_treatment: Reconcile to financing statement and payout.
  double_counting_risk: Entire deduction may be incorrectly treated as a fee.
  human_review_conditions:
  - Always review principal and cost split.
  example_platform_labels:
  - Shopify Capital remittance
  - Amazon Lending repayment
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
