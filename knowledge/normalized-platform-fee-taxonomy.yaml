metadata:
  title: Normalized Platform Fee Taxonomy
  filename: normalized-platform-fee-taxonomy.yaml
  version: 1.0.0
  status: production-ready
  last_updated: '2026-07-27'
  default_example_currency: USD
  date_standard: ISO 8601
  currency_standard: ISO 4217
  sign_convention: normalized_amount is positive when merchant economic value or cash increases and negative when it decreases;
    contextual classes require a direction subtype.
  null_rule: null means unknown or not supplied; zero means confirmed zero.
  related_files:
  - master-transaction-schema.json
  - column-mapping-library.json
  - reconciliation-and-calculation-rules.md
global_rules:
  classification_precedence:
  - Use the most specific supported classification.
  - Preserve original platform label and record ID.
  - Separate principal, fee, reserve, tax, and transfer components when evidence supports the split.
  - Do not classify payouts or bank deposits as revenue.
  - Do not classify temporary reserve holds as permanent expense.
  - Do not use UNCLASSIFIED as a permanent dumping ground.
  confidence_values:
  - high
  - medium
  - low
  - unable_to_determine
  automatic_human_review:
  - material discrepancy
  - tax or duty
  - financing allocation
  - ambiguous reserve or fee
  - multi-currency conflict
  - material unclassified amount
  - dispute or chargeback outcome
classifications:
- canonical_code: REV_GROSS_SALES
  display_name: Gross sales
  parent_category: revenue
  definition: Merchandise revenue before discounts, refunds, taxes, duties, tips, and shipping income.
  included_transaction_types:
  - captured sale
  - product sale
  excluded_transaction_types:
  - payout
  - bank deposit
  expected_sign: positive
  cash_flow_treatment: Increases platform receivable or cash before deductions.
  margin_treatment: Included in revenue base.
  reconciliation_treatment: Include once at order or transaction level.
  double_counting_risk: Order totals may repeat across line items.
  human_review_conditions:
  - Repeated order totals
  - uncaptured authorization
  - missing currency
  example_platform_labels:
  - Shopify Subtotal
  - Amazon product-sales
  - Stripe charge gross
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: REV_DISCOUNT
  display_name: Discounts
  parent_category: revenue_contra
  definition: Merchant- or platform-funded reduction to merchandise price.
  included_transaction_types:
  - order discount
  - line discount
  - promotion rebate
  excluded_transaction_types:
  - refund
  - advertising credit
  expected_sign: negative
  cash_flow_treatment: Reduces expected settlement when merchant-funded.
  margin_treatment: Reduces net merchandise revenue.
  reconciliation_treatment: Subtract once and identify funding source.
  double_counting_risk: May already be netted from gross sales or repeated at multiple grains.
  human_review_conditions:
  - Unknown funding source
  - pre/post-discount gross ambiguity
  example_platform_labels:
  - Shopify Discount Amount
  - Amazon promotional-rebate
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: PASS_TAX
  display_name: Taxes
  parent_category: pass_through
  definition: Tax collected, withheld, remitted, or reversed in connection with a transaction.
  included_transaction_types:
  - sales tax
  - marketplace withheld tax
  - tax reversal
  excluded_transaction_types:
  - product revenue
  - non-tax platform fee
  expected_sign: contextual
  cash_flow_treatment: Collection can increase settlement; withholding or remittance decreases it.
  margin_treatment: Excluded from contribution revenue and cost by default.
  reconciliation_treatment: Track collection and withholding separately.
  double_counting_risk: Tax may be embedded in gross or net.
  human_review_conditions:
  - Always review tax classification and accounting treatment.
  example_platform_labels:
  - Shopify Taxes
  - Amazon item-tax
  - Amazon marketplace-withheld-tax
  - Stripe tax_fee
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: REV_SHIPPING_INCOME
  display_name: Shipping income
  parent_category: revenue
  definition: Shipping amount charged to the customer.
  included_transaction_types:
  - shipping charge
  - shipping credit
  excluded_transaction_types:
  - shipping label cost
  - carrier expense
  expected_sign: positive
  cash_flow_treatment: Increases settlement or receivable.
  margin_treatment: Included in economic revenue; offset costs separately.
  reconciliation_treatment: Include once and preserve refunds separately.
  double_counting_risk: Can be confused with shipping expense or included in order total.
  human_review_conditions:
  - Net shipping or mixed tax treatment
  example_platform_labels:
  - Shopify Shipping
  - Amazon shipping-credits
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: REV_TIPS
  display_name: Tips
  parent_category: revenue
  definition: Customer tips collected for the merchant or staff.
  included_transaction_types:
  - tip amount
  excluded_transaction_types:
  - service fee
  - platform-retained gratuity
  expected_sign: positive
  cash_flow_treatment: Increases settlement subject to payout rules.
  margin_treatment: Include only when economically retained.
  reconciliation_treatment: Reconcile separately from product sales.
  double_counting_risk: May already be included in total amount.
  human_review_conditions:
  - Retention or payroll treatment unclear
  example_platform_labels:
  - Shopify Tips
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: REV_REFUND
  display_name: Refunds
  parent_category: revenue_contra
  definition: Reversal of previously recognized customer revenue.
  included_transaction_types:
  - merchandise refund
  - shipping refund
  - partial refund
  excluded_transaction_types:
  - return-processing fee
  - chargeback fee
  expected_sign: negative
  cash_flow_treatment: Reduces platform balance or future payout.
  margin_treatment: Reduces net revenue; not a fee.
  reconciliation_treatment: Link to original order or charge when possible.
  double_counting_risk: May appear in order and settlement exports.
  human_review_conditions:
  - Unmatched, failed, or cross-period refund
  example_platform_labels:
  - Shopify refund
  - Amazon Refund
  - Stripe refund
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: OPS_RETURN
  display_name: Returns
  parent_category: operating_event
  definition: Physical or operational return event, including inventory disposition.
  included_transaction_types:
  - returned unit
  - return received
  - returnless refund
  excluded_transaction_types:
  - refund principal
  - return-processing fee
  expected_sign: contextual
  cash_flow_treatment: Cash effect comes from associated refund and costs.
  margin_treatment: Used for return-rate and inventory analysis.
  reconciliation_treatment: Link to refund, reimbursement, and fee records.
  double_counting_risk: Return and refund are related but not identical.
  human_review_conditions:
  - Missing disposition
  - return without refund
  example_platform_labels:
  - Amazon return status
  - Shopify return record
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: RISK_CHARGEBACK
  display_name: Chargebacks
  parent_category: risk_and_disputes
  definition: Customer-dispute principal removed or held after a chargeback.
  included_transaction_types:
  - chargeback principal
  - payment reversal
  excluded_transaction_types:
  - dispute fee
  - ordinary refund
  expected_sign: negative
  cash_flow_treatment: Reduces available balance or payout.
  margin_treatment: Reduces economic value when loss is confirmed.
  reconciliation_treatment: Link to original charge and dispute lifecycle.
  double_counting_risk: Principal may coexist with a provisional hold and later reversal.
  human_review_conditions:
  - Provisional vs final status
  - recovery unresolved
  example_platform_labels:
  - Shopify chargeback
  - Stripe payment_reversal
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: RISK_DISPUTE
  display_name: Disputes
  parent_category: risk_and_disputes
  definition: Dispute case or lifecycle event, including provisional holds and outcomes.
  included_transaction_types:
  - dispute opened
  - won
  - lost
  - withdrawn
  excluded_transaction_types:
  - ordinary refund
  expected_sign: contextual
  cash_flow_treatment: May hold, remove, or restore cash.
  margin_treatment: Margin impact depends on final outcome.
  reconciliation_treatment: Retain status history and related transactions.
  double_counting_risk: Lifecycle events can be mistaken for separate losses.
  human_review_conditions:
  - Always review final status and deadlines.
  example_platform_labels:
  - Stripe dispute
  - Shopify dispute
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
- canonical_code: FEE_PROCESSING
  display_name: Processing fees
