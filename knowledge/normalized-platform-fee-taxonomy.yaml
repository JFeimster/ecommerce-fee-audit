  - international fee
  expected_sign: negative
  cash_flow_treatment: Reduces converted proceeds.
  margin_treatment: Variable cost when transaction-related.
  reconciliation_treatment: Reconcile source and settlement currencies.
  double_counting_risk: Fee may be embedded in rate and also itemized.
  human_review_conditions:
  - Rate source or fee basis unknown
  example_platform_labels:
  - Shopify Currency conversion fee
  - Stripe stripe_fx_fee
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
