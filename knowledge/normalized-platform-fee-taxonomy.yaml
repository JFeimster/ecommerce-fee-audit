  - wallet fee
  - payment-method fee
  excluded_transaction_types:
  - referral fee
  - instant payout fee
  - FX fee
  expected_sign: negative
  cash_flow_treatment: Reduces settlement or processor balance.
  margin_treatment: Variable cost included in contribution margin when attributable.
  reconciliation_treatment: Reconcile to charge and fee detail.
  double_counting_risk: Can be combined and separately itemized.
  human_review_conditions:
