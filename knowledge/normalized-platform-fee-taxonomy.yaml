  - sale
  expected_sign: positive
  cash_flow_treatment: Increases available cash.
  margin_treatment: No new revenue or contribution profit.
  reconciliation_treatment: Reduce reserve ledger and increase expected payout.
  double_counting_risk: Can be mistaken for revenue or reimbursement.
  human_review_conditions:
  - No link to prior hold
  example_platform_labels:
  - Stripe reserve_release
  - Shopify reserve release
  confidence_guidance: high when source label, amount behavior, and related IDs agree; medium when contextual evidence is
    sufficient but incomplete; low or unable_to_determine when generic, conflicting, or unsupported.
