name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional production base URL override
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_BASE_URL }}
    steps:
      - name: Resolve production URL
        shell: bash
        env:
          INPUT_BASE_URL: ${{ inputs.base_url }}
          ENV_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          BASE_URL="${INPUT_BASE_URL:-$ENV_BASE_URL}"
          if [ -z "$BASE_URL" ]; then
            echo 'Provide base_url or configure PRODUCTION_BASE_URL in the GitHub production environment.' >&2
            exit 1
          fi
          echo "BASE_URL=${BASE_URL%/}" >> "$GITHUB_ENV"

      - name: Check public endpoints
        shell: bash
        run: |
          set -euo pipefail
          for path in / /embed /styles.css /script.js /site.webmanifest /robots.txt; do
            echo "Checking ${BASE_URL}${path}"
            curl --fail --silent --show-error --location --max-time 30 "${BASE_URL}${path}" > /dev/null
          done

      - name: Verify homepage and embed markers
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --location "${BASE_URL}/" | grep -qi 'Ecommerce Fee Audit'
          curl --fail --silent --location "${BASE_URL}/embed" | grep -qi 'Embeddable Audit Signal'
