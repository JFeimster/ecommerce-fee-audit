name: Link Check

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'site/**/*.html'
      - '.github/workflows/link-check.yml'
  schedule:
    - cron: '20 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,204,206,429
            './**/*.md'
            './site/**/*.html'
          fail: true
