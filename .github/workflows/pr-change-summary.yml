name: PR Change Summary

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - name: Summarize changed paths
        uses: actions/github-script@v9
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });

            const names = files.map(file => file.filename);
            const groups = {
              site: names.filter(name => name.startsWith('site/')),
              knowledge: names.filter(name => name.startsWith('knowledge/')),
              workflows: names.filter(name => name.startsWith('.github/workflows/')),
              security: names.filter(name => /privacy|security|action-usage|vercel\.json/i.test(name))
            };

            const lines = ['## Automated change summary', ''];
            for (const [group, groupFiles] of Object.entries(groups)) {
              if (groupFiles.length) {
                lines.push(`### ${group}`, ...groupFiles.map(name => `- \`${name}\``), '');
              }
            }
            lines.push('### Review reminders');
            lines.push('- Preserve privacy, confirmation, and human-review guardrails.');
            lines.push('- Do not add real client or financial data to public paths.');
            lines.push('- Verify `site/vercel.json` changes before production deployment.');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n')
            });
