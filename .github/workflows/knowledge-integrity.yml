name: Knowledge Integrity

on:
  pull_request:
    paths:
      - 'knowledge/**'
      - '.github/scripts/validate_knowledge.py'
      - '.github/workflows/knowledge-integrity.yml'
  push:
    branches: [main]
    paths:
      - 'knowledge/**'
      - '.github/scripts/validate_knowledge.py'
      - '.github/workflows/knowledge-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Validate Knowledge Library
        run: python .github/scripts/validate_knowledge.py
