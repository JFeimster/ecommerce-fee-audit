version: 1.0.0
status: provisional
triggers:
  - trigger_id: starter_to_audit_lab
    from_product_id: free_platform_fee_audit_starter
    to_product_id: audit_lab
    signals: [needs_recurring_monthly_workflow, needs_full_template_library, wants_self_directed_audit]
  - trigger_id: audit_lab_to_margin_control
    from_product_id: audit_lab
    to_product_id: margin_control
    signals: [unresolved_reconciliation_exceptions, multiple_platforms, reserve_or_hold_exposure, needs_human_interpretation]
  - trigger_id: margin_control_to_guided_margin_recovery
    from_product_id: margin_control
    to_product_id: guided_margin_recovery
    signals: [needs_private_workspace, needs_structured_monthly_cadence, material_exception_review, recurring_data_gaps]
  - trigger_id: guided_to_finance_ops
    from_product_id: guided_margin_recovery
    to_product_id: ecommerce_finance_ops_desk
    signals: [multi_channel_complexity, recurring_close_support, multiple_currencies, weekly_cash_pressure, high_file_volume]
  - trigger_id: any_to_partner_license
    from_product_id: any
    to_product_id: partner_agency_license
    signals: [serves_multiple_client_businesses, requests_licensed_delivery, accepts_partner_controls]
rule: Triggers support an offer conversation; they are not eligibility determinations, underwriting decisions, or promises of outcome.
