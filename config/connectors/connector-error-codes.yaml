version: 1.0.0
errors:
  connector_not_found: {http_status: 404, retryable: false, human_review_trigger: false, user_safe_message: Connector is not available for this request., diagnostic_category: configuration, emitted_event: system.validation_failed, fallback_action: select_supported_connector}
  authorization_required: {http_status: 401, retryable: false, human_review_trigger: false, user_safe_message: Authorization is required before syncing this source., diagnostic_category: authorization, emitted_event: connector.authorization_failed, fallback_action: reauthorize}
  authorization_expired: {http_status: 401, retryable: false, human_review_trigger: false, user_safe_message: Authorization has expired and must be renewed., diagnostic_category: authorization, emitted_event: connector.authorization_expired, fallback_action: reauthorize}
  account_selection_required: {http_status: 409, retryable: false, human_review_trigger: false, user_safe_message: Select the account to use before syncing., diagnostic_category: selection, emitted_event: connector.account_selected, fallback_action: user_select_account}
  ownership_verification_failed: {http_status: 403, retryable: false, human_review_trigger: true, user_safe_message: Account ownership could not be verified., diagnostic_category: authorization, emitted_event: system.manual_intervention_requested, fallback_action: manual_review}
  scope_insufficient: {http_status: 403, retryable: false, human_review_trigger: false, user_safe_message: The authorized access is not sufficient for this data., diagnostic_category: authorization, emitted_event: connector.authorization_failed, fallback_action: reauthorize}
  provider_unavailable: {http_status: 503, retryable: true, human_review_trigger: false, user_safe_message: The provider is temporarily unavailable., diagnostic_category: provider, emitted_event: system.provider_unavailable, fallback_action: retry_or_manual_upload}
  provider_rate_limited: {http_status: 429, retryable: true, human_review_trigger: false, user_safe_message: The provider rate limit was reached; the sync will be retried., diagnostic_category: provider, emitted_event: system.rate_limit_reached, fallback_action: scheduled_retry}
  sync_failed: {http_status: 502, retryable: true, human_review_trigger: configured, user_safe_message: The sync did not complete., diagnostic_category: synchronization, emitted_event: connector.sync_failed, fallback_action: retry_or_manual_upload}
  sync_partial: {http_status: 206, retryable: true, human_review_trigger: configured, user_safe_message: Some source data was processed; a follow-up may be needed., diagnostic_category: synchronization, emitted_event: connector.sync_partially_completed, fallback_action: checkpoint_retry}
  unsupported_data_type: {http_status: 415, retryable: false, human_review_trigger: false, user_safe_message: This data type is not supported for this connector., diagnostic_category: validation, emitted_event: system.validation_failed, fallback_action: manual_mapping}
  invalid_cursor: {http_status: 409, retryable: false, human_review_trigger: configured, user_safe_message: The prior sync position is no longer valid., diagnostic_category: synchronization, emitted_event: connector.sync_failed, fallback_action: controlled_backfill}
  duplicate_sync: {http_status: 409, retryable: false, human_review_trigger: false, user_safe_message: An equivalent sync is already in progress or completed., diagnostic_category: idempotency, emitted_event: connector.sync_requested, fallback_action: return_existing_result}
  historical_window_exceeded: {http_status: 422, retryable: false, human_review_trigger: false, user_safe_message: The requested history exceeds the configured window., diagnostic_category: policy, emitted_event: system.validation_failed, fallback_action: shorter_period_or_manual_upload}
  payload_invalid: {http_status: 400, retryable: false, human_review_trigger: configured, user_safe_message: The provider payload could not be validated., diagnostic_category: validation, emitted_event: connector.webhook_rejected, fallback_action: quarantine}
  signature_invalid: {http_status: 401, retryable: false, human_review_trigger: true, user_safe_message: The incoming event could not be verified., diagnostic_category: security, emitted_event: connector.webhook_rejected, fallback_action: reject_and_audit}
  token_refresh_failed: {http_status: 401, retryable: false, human_review_trigger: false, user_safe_message: Authorization must be renewed before syncing., diagnostic_category: authorization, emitted_event: connector.authorization_expired, fallback_action: reauthorize}
  provider_response_ambiguous: {http_status: 502, retryable: false, human_review_trigger: true, user_safe_message: The provider response needs review before continuing., diagnostic_category: provider, emitted_event: system.manual_intervention_requested, fallback_action: manual_review}
  manual_fallback_required: {http_status: 422, retryable: false, human_review_trigger: true, user_safe_message: Continue with a manual upload or operator review., diagnostic_category: fallback, emitted_event: system.manual_intervention_requested, fallback_action: manual_upload}
