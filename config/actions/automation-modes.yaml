version: 1.0.0
modes:
  autonomous: {behavior: Runs after enabled authorization, setup_requirements: [stored_authorization, approved_destination, thresholds_pass], default_confirmation: none, allowed_risk_classes: [read_only, analysis, record_write, automated_routing, automated_decision, financial_data_access, external_submission], escalation: human_review_required_on_trigger, disablement: disable_workflow, audit_log: required, user_description: Runs matching approved workflow events automatically.}
  confirm_once: {behavior: One approval enables matching future events, setup_requirements: [scope_preview, stored_authorization], default_confirmation: workflow_enablement, allowed_risk_classes: [analysis, record_write, external_submission, automated_routing, automated_decision, financial_data_access], escalation: human_review_required_on_trigger, disablement: revoke_authorization, audit_log: required, user_description: Approve this workflow once for future matching events.}
  confirm_each_time: {behavior: Explicit approval for each payload, setup_requirements: [action_preview], default_confirmation: per_action, allowed_risk_classes: [record_write, external_submission, financial_data_access, financial_transaction, restricted], escalation: no_execution_without_confirmation, disablement: expire_pending_action, audit_log: required, user_description: Review and approve each specific action.}
  human_review_required: {behavior: Holds action in review queue, setup_requirements: [reviewer_assignment], default_confirmation: reviewer_decision, allowed_risk_classes: [analysis, record_write, external_submission, automated_routing, automated_decision, financial_data_access, financial_transaction, restricted], escalation: internal_escalation, disablement: close_or_reroute, audit_log: required, user_description: A configured rule requires review before execution.}
  internal_only: {behavior: Available to authorized internal workflows only, setup_requirements: [internal_identity], default_confirmation: internal_policy, allowed_risk_classes: [read_only, analysis, record_write, automated_routing, automated_decision, restricted], escalation: internal_review, disablement: remove_internal_access, audit_log: required, user_description: Internal operator or managed-service capability.}
