version: 1.0.0
policy: Stored authorization may support confirm_once or autonomous execution only when the routing mode and thresholds allow it.
auth_classes:
  no_auth: {minimum_scope: public_resources.read, user_identity_required: false, account_ownership_verification: false, destination_ownership_verification: false, elevated_permission: false, stored_authorization_support: false, operation_ids: [getPublicFeeTaxonomy, getAuditTemplateSchema, getDisputeChecklist, getFundingDocumentChecklist, getProductCatalog, getSupportedConnectors, getPricingSummary, getPublicSampleAudit, getPublicPromptPack]}
  api_key: {minimum_scope: audit.read_or_write, user_identity_required: true, account_ownership_verification: true, destination_ownership_verification: true, elevated_permission: configurable, stored_authorization_support: true, operation_ids: [createAudit, getAudit, updateAudit, runAudit, approveAuditWorkflow, getAuditFindings, requestUploadSession, finalizeUpload, generateAuditExport, saveAuditReport, generateAndSendReport, createDisputeCase, assembleDisputePackage, validateDisputeEvidence, submitDisputePackage, trackDisputeStatus, requestMissingDisputeEvidence, escalateDisputeCase, createFundingReadinessLead, createFundingApplication, submitFundingApplication, routeFundingApplication, runAutomatedQualification, runAutomatedRouting, requestBankConnection, sendDocumentRequest, startFollowUpSequence, startFundingFollowUpSequence, createCorrectiveAction, createManagedServiceTask]}
  oauth: {minimum_scope: connector.read, user_identity_required: true, account_ownership_verification: true, destination_ownership_verification: false, elevated_permission: false, stored_authorization_support: true, operation_ids: [beginConnectorSession, getConnectorStatus, requestConnectorSync, syncConnectedPlatform, disconnectConnector, refreshConnectorAuthorization, getAvailableAccounts, selectConnectorAccount]}
  internal_only: {minimum_scope: internal.operations, user_identity_required: true, account_ownership_verification: false, destination_ownership_verification: false, elevated_permission: true, stored_authorization_support: false, operation_ids: [approveLowConfidenceDecision, overrideRoutingDecision, resolveDataGap, requeueFailedJob, markDisputeReviewed, markApplicationReviewed, escalateCase, getInternalAuditTrail]}
