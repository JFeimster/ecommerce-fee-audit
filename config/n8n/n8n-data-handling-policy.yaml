version: 1.0.0
policy: {sensitive_data_classification: financial_confidential_or_restricted, allowed_node_data: [masked_references, canonical_records, consent, status], prohibited_node_data: [full_source_files, credentials, ssns, full_account_numbers, tokens], execution_data_retention: configurable_minimum, binary_data_handling: external_reference_only, source_file_references: opaque_only, redaction: required, log_filtering: required, error_payload_filtering: required, credential_isolation: required, test_data_rules: fictional_only, production_data_rules: minimum_necessary, customer_data_deletion: retention_policy_controlled, manual_debugging_restrictions: authorized_operator_only}
