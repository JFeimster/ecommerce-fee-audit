version: 1.0.0
rules:
  - {rule_id: required_fields, severity: error, blocking: true, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: Required source fields are missing., emitted_event: system.validation_failed, quarantine_behavior: quarantine, confidence_impact: high}
  - {rule_id: duplicate_records, severity: warning, blocking: false, auto_fix_eligible: true, human_review_trigger: configured, user_safe_message: Duplicate records were detected and handled according to the duplicate policy., emitted_event: job.progress_updated, quarantine_behavior: review_on_conflict, confidence_impact: medium}
  - {rule_id: missing_dates, severity: error, blocking: true, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: Required dates are missing., emitted_event: system.validation_failed, quarantine_behavior: quarantine, confidence_impact: high}
  - {rule_id: invalid_dates, severity: error, blocking: true, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: Some dates are not valid., emitted_event: system.validation_failed, quarantine_behavior: quarantine, confidence_impact: high}
  - {rule_id: future_dates, severity: warning, blocking: false, auto_fix_eligible: false, human_review_trigger: configured, user_safe_message: Future dates need review., emitted_event: system.validation_failed, quarantine_behavior: review_pending, confidence_impact: medium}
  - {rule_id: missing_currency, severity: error, blocking: true, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: Currency is missing for a monetary value., emitted_event: system.validation_failed, quarantine_behavior: quarantine, confidence_impact: high}
  - {rule_id: mixed_currencies, severity: warning, blocking: false, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: Multiple currencies require explicit separation., emitted_event: system.validation_failed, quarantine_behavior: review_pending, confidence_impact: high}
  - {rule_id: negative_amounts, severity: info, blocking: false, auto_fix_eligible: false, human_review_trigger: false, user_safe_message: Signed amounts are preserved for reconciliation., emitted_event: job.progress_updated, quarantine_behavior: none, confidence_impact: none}
  - {rule_id: verified_zero_amounts, severity: info, blocking: false, auto_fix_eligible: false, human_review_trigger: false, user_safe_message: Verified zero values are preserved as zero., emitted_event: job.progress_updated, quarantine_behavior: none, confidence_impact: none}
  - {rule_id: null_values, severity: warning, blocking: false, auto_fix_eligible: false, human_review_trigger: configured, user_safe_message: Unavailable values remain null and may require follow-up., emitted_event: job.progress_updated, quarantine_behavior: review_pending, confidence_impact: medium}
  - {rule_id: payout_mismatch, severity: error, blocking: false, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: Payout totals did not reconcile within the configured tolerance., emitted_event: audit.partially_completed, quarantine_behavior: none, confidence_impact: high}
  - {rule_id: fee_mismatch, severity: warning, blocking: false, auto_fix_eligible: false, human_review_trigger: configured, user_safe_message: Fee totals need reconciliation review., emitted_event: audit.partially_completed, quarantine_behavior: none, confidence_impact: medium}
  - {rule_id: total_mismatch, severity: error, blocking: false, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: Source totals do not match normalized totals., emitted_event: audit.partially_completed, quarantine_behavior: review_pending, confidence_impact: high}
  - {rule_id: duplicate_order_ids, severity: warning, blocking: false, auto_fix_eligible: false, human_review_trigger: configured, user_safe_message: Duplicate order identifiers require context., emitted_event: job.progress_updated, quarantine_behavior: review_on_conflict, confidence_impact: medium}
  - {rule_id: duplicate_transaction_ids, severity: warning, blocking: false, auto_fix_eligible: false, human_review_trigger: configured, user_safe_message: Duplicate transaction identifiers require context., emitted_event: job.progress_updated, quarantine_behavior: review_on_conflict, confidence_impact: medium}
  - {rule_id: missing_payout_references, severity: warning, blocking: false, auto_fix_eligible: false, human_review_trigger: configured, user_safe_message: Payout references are missing., emitted_event: audit.partially_completed, quarantine_behavior: review_pending, confidence_impact: medium}
  - {rule_id: unsupported_transaction_type, severity: warning, blocking: false, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: A transaction type could not be normalized., emitted_event: system.validation_failed, quarantine_behavior: review_pending, confidence_impact: medium}
  - {rule_id: missing_account_reference, severity: error, blocking: true, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: The source account reference is missing., emitted_event: system.validation_failed, quarantine_behavior: quarantine, confidence_impact: high}
  - {rule_id: inconsistent_period, severity: warning, blocking: false, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: Reporting periods overlap or conflict., emitted_event: audit.partially_completed, quarantine_behavior: review_pending, confidence_impact: high}
  - {rule_id: incomplete_source_file, severity: error, blocking: true, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: The source file appears incomplete., emitted_event: system.validation_failed, quarantine_behavior: quarantine, confidence_impact: high}
  - {rule_id: truncated_export, severity: error, blocking: true, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: The export appears truncated., emitted_event: system.validation_failed, quarantine_behavior: quarantine, confidence_impact: high}
  - {rule_id: suspicious_row_count, severity: warning, blocking: false, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: The row count needs review., emitted_event: system.validation_failed, quarantine_behavior: review_pending, confidence_impact: medium}
  - {rule_id: reconciliation_variance, severity: error, blocking: false, auto_fix_eligible: false, human_review_trigger: true, user_safe_message: Reconciliation has an unresolved variance., emitted_event: audit.partially_completed, quarantine_behavior: none, confidence_impact: high}
value_semantics: {null: unavailable_unknown_withheld_unsupported_or_not_supplied, zero: verified_zero_only, omitted: does_not_mean_zero, parsing_failure: never_zero, empty_string: never_zero, missing_fee_data: never_no_fees}
